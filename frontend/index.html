<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лесовод</title>
    <!--
      Локальных файлов шрифтов в проект не приложено, поэтому пока
      подключены через Google Fonts. Если на серверном ПК не будет
      интернета (см. Этап 6/8), эти два семейства нужно будет
      самостоятельно скачать .woff2 и подключить через @font-face в
      src/index.css — сама тема (tailwind.config.js) от источника
      шрифта не зависит.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
