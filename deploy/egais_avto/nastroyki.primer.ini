; Настройки робота выгрузки ЕГАИС. Скопируй этот файл в nastroyki.ini
; (ustanovit.bat делает это сам) и поправь под себя.
; Пароли сюда НЕ пишем — их спросит nastroit.bat и спрячет в
; «Диспетчер учётных данных» Windows.

[egais]
; ярлык или exe программы ЕГАИС
yarlyk = %USERPROFILE%\Desktop\EGAIS.lnk
; пользователь ЕГАИС (как в окне входа) — нужен только как имя, под которым
; хранится пароль; само поле логина робот не трогает, ЕГАИС подставляет его сам
login =
; галочки в «Тип документа», через «;», в том порядке, как они идут в списке
tipy_dokumentov = Перевод в сортимент;Расход при реализации потребителю;Приход;Расход при внутреннем перемещении
; закрывать ЕГАИС после выгрузки, если робот сам его открыл (yes/no)
zakryvat_posle = yes

[lesovod]
; адрес Лесовода из локальной сети
url = http://lesovod.local
; https с сертификатом Caddy (tls internal): положи его root.crt в папку робота
; под именем lesovod_root.crt или укажи путь здесь
sertifikat_ca =
; пользователь Лесовода с правом на «Расход» (лучше завести отдельного,
; например «robot-egais»). Пусто = только скачивать файл, без заливки.
login =

[obshchee]
; куда класть выгрузки
papka_vygruzok = %USERPROFILE%\Documents\ЕГАИС выгрузки
; сколько дней хранить старые выгрузки
hranit_dney = 30
; где искать файл, если ЕГАИС сохраняет его сам, без диалога
papki_poiska = %USERPROFILE%\Downloads;%USERPROFILE%\Documents;%USERPROFILE%\Desktop;%TEMP%
